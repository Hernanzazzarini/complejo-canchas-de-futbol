<section class="auth">
  <div class="auth-card">
    <h2>INICIAR SESIÓN</h2>
    <p class="subtitulo">Entrá para reservar tu turno.</p>

    @if (error()) {
      <div class="error-servidor">{{ error() }}</div>
    }

    <form [formGroup]="formulario" (ngSubmit)="enviar()">
      <div class="campo">
        <label for="email">EMAIL</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@mail.com"
          [class.invalido]="invalido('email')"
        />
        @if (invalido('email')) {
          <span class="ayuda">Ingresá un email válido.</span>
        }
      </div>

      <div class="campo">
        <label for="password">CONTRASEÑA</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [class.invalido]="invalido('password')"
        />
        @if (invalido('password')) {
          <span class="ayuda">Escribí tu contraseña.</span>
        }
      </div>

      <button class="btn-main" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="pie">
      ¿No tenés cuenta? <a routerLink="/registro">Registrate</a>
    </p>
  </div>
</section>
